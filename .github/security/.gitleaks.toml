# Gitleaks configuration file
# Detects secrets and credentials in git repositories

title = "Gitleaks Config"
description = "Custom Gitleaks rules for AWS secrets, private keys, and API keys"

# AWS Access Keys
[[rules]]
id = "aws-access-key"
description = "AWS Access Key"
regex = '''AKIA[0-9A-Z]{16}'''
secretGroup = 1
keywords = ["aws", "access", "key"]
confidence = "High"

[[rules]]
id = "aws-secret-key"
description = "AWS Secret Access Key"
regex = '''aws_secret_access_key\s*=\s*['""]?([A-Za-z0-9/+=]{40})['""]?'''
secretGroup = 1
keywords = ["aws", "secret", "access", "key"]
confidence = "High"

# Private Keys
[[rules]]
id = "private-key"
description = "Private Key (RSA, DSA, EC, PGP)"
regex = '''-----BEGIN (RSA|DSA|EC|PGP|OPENSSH) PRIVATE KEY-----'''
keywords = ["private", "key", "rsa", "dsa", "ec", "pgp"]
confidence = "High"

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''api[_-]?key\s*=\s*['""]?([A-Za-z0-9]{32,})['""]?'''
secretGroup = 1
keywords = ["api", "key"]
confidence = "Medium"

# GitHub Token
[[rules]]
id = "github-token"
description = "GitHub Personal Access Token"
regex = '''gh[pou]_[A-Za-z0-9_]{36,255}'''
keywords = ["github", "token", "pat"]
confidence = "High"

# Slack Token
[[rules]]
id = "slack-token"
description = "Slack Bot Token"
regex = '''xox[baprs]-[0-9a-zA-Z]{10,48}'''
keywords = ["slack", "token", "bot"]
confidence = "High"

# Database Connection Strings
[[rules]]
id = "db-connection-string"
description = "Database Connection String"
regex = '''(mysql|postgres|mongodb)://[^:]+:[^@]+@[^\s]+'''
secretGroup = 0
keywords = ["db", "database", "connection", "password"]
confidence = "High"

# Basic Auth Credentials
[[rules]]
id = "basic-auth"
description = "Basic Authentication Credentials"
regex = '''basic\s+[A-Za-z0-9+/=]{20,}'''
keywords = ["basic", "auth", "password"]
confidence = "Medium"

# JSON Web Token
[[rules]]
id = "jwt-token"
description = "JSON Web Token"
regex = '''eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.(?:[A-Za-z0-9_-]+)?'''
keywords = ["jwt", "token"]
confidence = "Medium"

# Generic Password Pattern
[[rules]]
id = "generic-password"
description = "Generic Password Assignment"
regex = '''(?i)(password|passwd|pwd|pass)\s*[:=]\s*['""]?([^\s'""]+)['""]?'''
secretGroup = 2
keywords = ["password", "passwd", "pwd"]
confidence = "Low"

# Allowlist for test/example files
[allowlist]
description = "Allowlist for test and example files"
files = [
  "test.*",
  ".*_test\\..*",
  "example.*",
  "mock.*",
  ".*/test/.*",
  ".*\\.test\\..*"
]
paths = [
  "tests/",
  "test/",
  "examples/",
  "__pycache__/",
  ".venv/",
  "node_modules/"
]

# Specific strings to ignore (common false positives)
regexes = [
  "AKIAIOSFODNN7EXAMPLE",  # AWS example access key
  "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY",  # AWS example secret key
]
