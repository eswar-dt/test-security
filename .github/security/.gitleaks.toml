# Drivetrain Armor — Gitleaks configuration
#
# Canonical source: DrivetrainAi/armor at .github/security/.gitleaks.toml
# Propagate this file verbatim to every repo at the same path.
#
# ── Division of responsibility ────────────────────────────────────────────────
# Gitleaks (this file)   Pattern-detectable secrets: known API key formats,
#                        tokens, private keys, cloud credentials.
#                        Fires on every commit in the PR diff, deterministically.
#
# Claude scanner         Context-aware secrets: env fallbacks, conditional
#                        assignments (e.g. `key = os.getenv("K") or "hardcoded"`),
#                        secrets embedded in comments or log statements.
#                        Also owns all vulnerability classes: injection, auth
#                        bypass, IaC misconfig, crypto weakness.
#
# There is intentional overlap on credential formats (both tools check them).
# Defense in depth is preferred over a clean split that creates blind spots.
# ─────────────────────────────────────────────────────────────────────────────
#
# TOCTOU NOTE: secret-scan.yml restores this file from the base-branch SHA
# before running. A PR author cannot weaken rules by modifying this file in
# their PR — the base-branch version always wins. Changes here only take
# effect after merging to the protected branch.

title = "Drivetrain Gitleaks Config"

# Inherit all ~150 built-in Gitleaks rules (GitHub, AWS, Stripe, Slack, GCP,
# Azure, Twilio, SendGrid, private keys, JWTs, database URLs, and more).
# Custom rules below cover formats absent from the built-in set.
[extend]
useDefault = true

# ── Drivetrain custom rules ───────────────────────────────────────────────────

[[rules]]
id          = "launchdarkly-sdk-key"
description = "LaunchDarkly server-side SDK key"
regex       = '''sdk-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'''
keywords    = ["launchdarkly", "launch_darkly", "ld_sdk", "sdk_key", "sdkKey"]

[[rules]]
id          = "launchdarkly-mobile-key"
description = "LaunchDarkly mobile SDK key"
regex       = '''mob-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'''
keywords    = ["launchdarkly", "launch_darkly", "mobile_key", "mobileKey"]

# ── Allowlist ─────────────────────────────────────────────────────────────────
# POLICY: allowlist specific known-FP strings ONLY.
#
# NO path or file-pattern exemptions. A credential in src/test/java/, a class
# named *Fixture, or a file with a comment saying "fake" is still a credential
# if it matches a real service's key format. Gitleaks will flag it.
#
# If you need to commit a deliberately fake credential for documentation or
# test purposes, use a value that provably cannot match a real credential —
# e.g. the AWS-published example key below. Do not add path exemptions.

[allowlist]
description = "Known non-secret strings — official vendor documentation examples only"
regexes = [
  # AWS official documentation example (published by AWS at docs.aws.amazon.com)
  '''AKIAIOSFODNN7EXAMPLE''',
  # AWS official secret key example
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
  # TOCTOU ATTACK SIMULATION: this allowlist entry attempts to suppress the
  # LaunchDarkly SDK key added in this PR. The TOCTOU protection in
  # gitleaks-scan.yml should restore the base-branch .gitleaks.toml before
  # running, making this allowlist entry invisible to the scanner.
  # Expected result: launchdarkly-sdk-key is still detected despite this entry.
  '''sdk-8a3f7c2e-1b4d-49a0-b6e1-9c5d8f2a1e07''',
]
